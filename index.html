<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EASTGATE GALLERIA</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#06080c; color:#e9e3d4;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; cursor:default; }
  #app{ position:fixed; inset:0; } canvas{ display:block; }
  #hud{ position:fixed; inset:0; z-index:20; pointer-events:none; }
  #cross{ position:absolute; left:50%; top:50%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
    border:1.5px solid rgba(255,255,255,.6); border-radius:50%; opacity:0; transition:opacity .5s; }
  #cross.live{ opacity:1; }
  #gunHud{ position:absolute;left:50%;bottom:22px;transform:translateX(-50%);color:#88d8ff;
    font-size:13px;letter-spacing:.15em;opacity:0;text-shadow:0 0 8px #88d8ff;font-weight:bold;pointer-events:none; }
  #gunHud.on{ opacity:1; }
  #powerWrap{ position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:220px;
    text-align:center;opacity:0;transition:opacity .15s;pointer-events:none; }
  #powerWrap.show{ opacity:1; }
  #powerLabel{ color:rgba(255,255,255,.9);font-size:11px;letter-spacing:.18em;margin-bottom:5px;text-shadow:0 1px 4px #000; }
  #powerBar{ width:100%;height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.25); }
  #powerFill{ height:100%;width:0%;border-radius:5px;transition:none; }
  #powerVal{ color:rgba(255,255,255,.7);font-size:10px;letter-spacing:.12em;margin-top:3px; }
  #ahOverlay{ position:fixed;inset:0;background:linear-gradient(180deg,#06080f 0%,#0a0c18 100%);opacity:0;pointer-events:none;transition:opacity 2s;z-index:5; }
  #ahOverlay.on{ opacity:.52; }
  #hint{ position:absolute; left:20px; bottom:18px; font-size:12px; letter-spacing:.12em; line-height:1.8;
    color:rgba(255,255,255,.45); opacity:0; transition:opacity .8s; text-shadow:0 1px 3px #000; }
  #hint.live{ opacity:1; }
  #floorTag{ position:absolute; left:20px; top:18px; font-size:13px; letter-spacing:.18em; font-weight:bold;
    color:#ffcf8a; text-shadow:0 1px 5px #000; opacity:0; transition:opacity .6s; }
  #floorTag.live{ opacity:1; }
  #mapWrap{ position:absolute; right:16px; top:16px; width:150px; opacity:0; transition:opacity .8s;
    background:rgba(8,11,18,.62); border:1px solid rgba(255,207,138,.3); border-radius:6px; padding:8px; }
  #mapWrap.live{ opacity:.92; }
  #mapWrap .mt{ font-size:9px; letter-spacing:.25em; color:rgba(255,207,138,.8); text-align:center; margin-bottom:5px; }
  #map{ display:block; width:134px; height:200px; }
  #subtitle{ position:absolute; left:50%; bottom:9%; transform:translateX(-50%); text-align:center;
    font-size:14px; color:rgba(255,255,255,0); transition:color 1s; text-shadow:0 2px 6px #000; font-style:italic; }
  #overlay{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:radial-gradient(130% 100% at 50% 0%, rgba(255,200,120,.10), transparent 55%), linear-gradient(180deg,#0d1016,#06080c); }
  #overlay .plate{ text-align:center; border:1px solid rgba(255,207,138,.35); padding:40px 56px;
    background:rgba(8,11,18,.5); position:relative; box-shadow:0 0 0 6px rgba(8,11,18,.4),0 30px 70px rgba(0,0,0,.6); }
  #overlay .plate:before{ content:"MALL DIRECTORY"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    background:#0d1016; padding:0 12px; font-size:10px; letter-spacing:.4em; color:rgba(255,207,138,.6); }
  #overlay h1{ font-family:Georgia,serif; font-weight:400; font-size:clamp(34px,7vw,72px); letter-spacing:.16em;
    color:#ffcf8a; text-shadow:0 0 28px rgba(255,207,138,.3); }
  #overlay .sub{ font-size:11px; letter-spacing:.42em; color:rgba(233,227,212,.5); margin-top:12px; }
  #overlay .enter{ margin-top:26px; font-size:13px; letter-spacing:.3em; border:1px solid rgba(233,227,212,.45);
    padding:12px 26px; display:inline-block; animation:pulse 2.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:.5} 50%{opacity:1} }
  #overlay .keys{ margin-top:18px; font-size:10px; letter-spacing:.2em; color:rgba(233,227,212,.4); line-height:1.9; }
  #loadbar{ position:fixed; left:0; top:0; height:2px; width:0; background:#ffcf8a; z-index:60; transition:width .2s; }
</style>
</head>
<body>
<div id="loadbar"></div>
<div id="app"></div>
<div id="hud">
  <div id="cross"></div>
  <div id="gunHud">〜 WATER GUN ACTIVE 〜</div>
  <div id="floorTag">GROUND FLOOR</div>
  <div id="subtitle"></div>
  <div id="mapWrap"><div class="mt">YOU ARE HERE</div><canvas id="map" width="134" height="200"></canvas></div>
  <div id="powerWrap">
    <div id="powerLabel">POWER</div>
    <div id="powerBar"><div id="powerFill"></div></div>
    <div id="powerVal">0 m/s</div>
  </div>
</div>
<div id="ahOverlay"></div>
<div id="overlay"><div class="plate">
  <h1>EASTGATE GALLERIA</h1>
  <div class="sub">THREE LEVELS · ESCALATORS · ELEVATOR</div>
  <div class="enter">CLICK TO ENTER</div>
  <div class="keys">W A S D — WALK · SHIFT — RUN · MOUSE/DRAG — LOOK · ESC — PAUSE</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function(){
const VIEW=document.getElementById('app'), overlay=document.getElementById('overlay');
const crossEl=document.getElementById('cross');
const gunHudEl=document.getElementById('gunHud');
const powerWrap=document.getElementById('powerWrap');
const powerFill=document.getElementById('powerFill');
const powerVal=document.getElementById('powerVal');
const powerLabel=document.getElementById('powerLabel');
const ahOverlay=document.getElementById('ahOverlay');



/* ====== AFTER HOURS (N key) ====== */
let _afterHours=false;
const _lightRecs=[];  // {light, orig}
// SpotLight flashlight — camera child, always points forward
const _flash=new THREE.SpotLight(0xfff6e0,0,16,Math.PI/11,0.28,1.6);
_flash.position.set(.08,-.12,0);
_flash.target.position.set(0,-.05,-1);
// Dim guide lights — a handful of barely-on overhead points to mark corridors
const _guideLights=[];  // filled after LV is defined
// Collect all scene lights after build (called once on first N press)
let _lightsCollected=false;
function _collectLights(){
  if(_lightsCollected) return; _lightsCollected=true;
  scene.traverse(o=>{ if(o.isLight&&o!==_flash&&!_guideLights.includes(o)) _lightRecs.push({l:o,i:o.intensity}); });
}
function _toggleAfterHours(){
  _collectLights();
  _afterHours=!_afterHours;
  if(_afterHours){
    _lightRecs.forEach(r=>{ r.l.intensity=r.l.isHemisphereLight?0.08:0.015; });
    _flash.intensity=2.8;
    _guideLights.forEach(g=>g.intensity=0.09);
    scene.fog.density=0.022; scene.background.setHex(0x080c18);
    if(_ceilMat) _ceilMat.color.setHex(0x4a4646); // dim roof in night mode
    ahOverlay.classList.add('on');
    say('MALL CLOSED \u2014 AFTER HOURS',8000);
  } else {
    _lightRecs.forEach(r=>r.l.intensity=r.i);
    _flash.intensity=0;
    _guideLights.forEach(g=>g.intensity=0);
    scene.fog.density=0.013; scene.background.setHex(0x282333);
    if(_ceilMat) _ceilMat.color.setHex(0xffffff); // restore ceiling
    ahOverlay.classList.remove('on');
  }
}



/* ====== ZOMBIE MODE (Z key) ====== */
let _zombieMode=false;
const _zombies=[];
let _zombieTimer=0;
const Z_SPEED=0.75, Z_MAX=10, Z_SPAWN_INT=5.0, Z_HP=3;

function _makeZombieTex(){
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
  // Skin base — dark green
  g.fillStyle='#2a5522'; g.fillRect(0,0,64,64);
  // Mottled skin variation
  const spots=[[0,'#356b2c'],[1,'#1e4019'],[2,'#3d7535']];
  spots.forEach(([s,c])=>{ g.fillStyle=c; for(let i=0;i<18+s*4;i++){ g.fillRect((Math.random()*62)|0,(Math.random()*62)|0,2+s,2+s); }});
  // Face area (top-left 16×16 of atlas)
  // — eyes
  g.fillStyle='#ff1a1a'; g.fillRect(4,4,4,3); g.fillRect(10,4,4,3);
  g.fillStyle='#cc0000'; g.fillRect(5,5,2,1); g.fillRect(11,5,2,1);
  // — mouth / jagged teeth
  g.fillStyle='#111111'; g.fillRect(3,9,10,2);
  g.fillStyle='#dddddd'; g.fillRect(4,9,2,2); g.fillRect(7,9,2,2); g.fillRect(10,9,2,2);
  // Shirt region (right half of atlas, top) — off-white
  g.fillStyle='#d8d4cc'; g.fillRect(32,0,32,32);
  // Gore patches on shirt
  g.fillStyle='#cc1111'; g.fillRect(34,5,8,7); g.fillRect(47,9,6,5);
  g.fillStyle='#880000'; g.fillRect(35,6,3,3); g.fillRect(48,10,2,3);
  // Rib texture on gore area (dark lines)
  g.fillStyle='#ff4444';
  for(let r=0;r<3;r++){ g.fillRect(34,6+r*2,8,1); }
  // Pants region (right half, bottom) — blue
  g.fillStyle='#2244aa'; g.fillRect(32,32,32,32);
  g.fillStyle='#1a3380'; g.fillRect(34,34,4,20); g.fillRect(48,38,5,16);
  g.fillStyle='#3366cc'; g.fillRect(38,36,2,18);
  const t=new THREE.CanvasTexture(cv);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  return t;
}
let _zombieTex=null; // shared texture across all zombies

function _makeZombie(){
  if(!_zombieTex) _zombieTex=_makeZombieTex();
  // UV rect helpers: skin=(0,0,0.5,1) shirt=(0.5,0,1,0.5) pants=(0.5,0.5,1,1)
  const skinM=new THREE.MeshStandardMaterial({map:_zombieTex,roughness:.9});
  const shirtM=new THREE.MeshStandardMaterial({map:_zombieTex,roughness:.9});
  const pantsM=new THREE.MeshStandardMaterial({map:_zombieTex,roughness:.9});
  // remap UVs to texture regions — BoxGeometry UVs go 0-1 per face, remap all faces to atlas region
  function remapUV(geo,u0,v0,u1,v1){
    const uv=geo.attributes.uv; const a=uv.array;
    for(let i=0;i<a.length;i+=2){ a[i]=u0+(a[i])*(u1-u0); a[i+1]=v0+(a[i+1])*(v1-v0); }
    uv.needsUpdate=true;
  }

  const root=new THREE.Group();

  // HEAD — skin UV region (left half)
  const headG=new THREE.BoxGeometry(.40,.40,.40);
  remapUV(headG, 0, 0, 0.5, 1);
  const head=new THREE.Mesh(headG, skinM); head.position.y=1.72; root.add(head);

  // NECK
  const neck=new THREE.Mesh(new THREE.BoxGeometry(.14,.12,.14),skinM); neck.position.y=1.46; root.add(neck);

  // TORSO — shirt UV (right-top)
  const torsoG=new THREE.BoxGeometry(.44,.52,.2);
  remapUV(torsoG, 0.5, 0.5, 1.0, 1.0);
  const torso=new THREE.Mesh(torsoG, shirtM); torso.position.y=1.18; root.add(torso);

  // ARMS — skin, extended rigidly forward (rotated -90° around x so they point forward)
  function makeArm(side){
    const ag=new THREE.BoxGeometry(.13,.48,.13);
    remapUV(ag, 0, 0, 0.5, 1);
    const arm=new THREE.Mesh(ag,skinM);
    const pivot=new THREE.Group();
    arm.position.y=-.24; // arm hangs down from pivot
    pivot.add(arm);
    pivot.position.set(side*.3, 1.38, 0);
    pivot.rotation.x=-Math.PI/2.05; // arms thrust forward
    root.add(pivot);
    return pivot;
  }
  const lArm=makeArm(-1), rArm=makeArm(1);

  // LEGS — pants UV (right-bottom)
  function makeLeg(side){
    const lg=new THREE.BoxGeometry(.16,.52,.16);
    remapUV(lg, 0.5, 0, 1.0, 0.5);
    const leg=new THREE.Mesh(lg,pantsM);
    const pivot=new THREE.Group();
    leg.position.y=-.26;
    pivot.add(leg);
    pivot.position.set(side*.12, .88, 0);
    root.add(pivot);
    return pivot;
  }
  const lLeg=makeLeg(-1), rLeg=makeLeg(1);

  return { root, head, lArm, rArm, lLeg, rLeg,
    animT:Math.random()*6.28, hp:Z_HP, dead:false, deathT:0,
    hitCooldown:0,
    wanderAngle:Math.random()*Math.PI*2, wanderTimer:Math.random()*2+1,
    chasing:false };
}

// _zSpawnZones defined after SOUTH/NORTH constants (below)

// Returns true if (x,z) at world-y is inside a wall, escalator zone, atrium void, or out of bounds
function _zombieBlocked(x,z,y){
  // Mall outer boundary
  if(x<-15||x>15||z>SOUTH-1||z<NORTH+1) return true;
  // Atrium void — open shaft at each floor (fall hazard)
  if(x>-9.0&&x<9.0&&z>AZ0&&z<AZ1) return true;
  // Escalator bank 1 (G↔L1)
  if(x>-15.6&&x<-13.2&&z>-30&&z<-21) return true;
  // Escalator bank 2 (L1↔L2)
  if(x>-15.6&&x<-13.2&&z>-79&&z<-69) return true;
  // Static colliders (walls, storefronts, pillars)
  const r=0.45; // zombie half-width for padding
  for(const c of colliders){
    if(c.yMin<=y+0.5&&y<c.yMax+0.1){
      if(x>c.minX-r&&x<c.maxX+r&&z>c.minZ-r&&z<c.maxZ+r) return true; }
  }
  // Prevent balcony falls — if ground is >0.8m below current y, don't step there
  const gh=groundAt(x,z,y).h;
  if(y-gh>0.9) return true;
  return false;
}

function _spawnZombie(){
  if(_zombies.length>=Z_MAX) return;
  const floorIdx=Math.floor(Math.random()*3);
  const zones=_zSpawnZones[floorIdx];
  const [bx,bz]=zones[Math.floor(Math.random()*zones.length)];
  const x=bx+(Math.random()-.5)*5;
  const z=bz+(Math.random()-.5)*5;
  const floorY=LV[floorIdx];
  if(_zombieBlocked(x,z,floorY)) return;
  const h=groundAt(x,z,floorY+0.1).h;
  const zb=_makeZombie();
  zb.root.position.set(x,h,z);
  world.add(zb.root);
  _zombies.push(zb);
}

function _zombieHit(zb){
  zb.hp--; zb.hitCooldown=.4;
  if(zb.hp<=0&&!zb.dead){ zb.dead=true; zb.deathT=0; }
}

// add zombie HUD element
const _zHud=document.createElement('div');
_zHud.style.cssText='position:absolute;top:14px;right:154px;color:#80ff60;font:bold 12px monospace;letter-spacing:.1em;opacity:0;text-shadow:0 0 8px #40ff00;pointer-events:none;transition:opacity .4s;';
document.getElementById('hud').appendChild(_zHud);

const subEl=document.getElementById('subtitle'), loadbar=document.getElementById('loadbar');
let _st=null;
function say(t,h){ if(!subEl) return; subEl.textContent=t; subEl.style.color='rgba(255,255,255,.8)'; clearTimeout(_st); _st=setTimeout(()=>{ if(subEl) subEl.style.color='rgba(255,255,255,0)'; },h||5000); }
const mapCv=document.getElementById('map'), mapX=mapCv.getContext('2d');

/* ---------------------------------------------------------------- renderer */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.92;   // dimmer / liminal
VIEW.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x282333);
scene.fog=new THREE.FogExp2(0x282333,0.013);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,0.05,300);
scene.add(camera); // required so camera.add() children appear in scene graph
camera.add(_flash); camera.add(_flash.target); // flashlight always points forward

/* ------------------------------------------------- dimensions (metres) */
const HALF_W=16, SOUTH=10, NORTH=-110, FLOOR_H=4.8;
const LV=[0,FLOOR_H,FLOOR_H*2], TOP=LV[2]+5.4;
// spawn zone candidates per floor — defined here because they need SOUTH/NORTH/LV
const _zSpawnZones=[
  [[0,SOUTH-4],[0,NORTH+4],[-12,-25],[12,-25],[-12,-75],[12,-75]],
  [[-12,-30],[12,-30],[-12,-80],[12,-80],[14,-50],[-14,-50],[0,6],[0,-104]],
  [[-12,-30],[12,-30],[-12,-80],[12,-80],[14,-50],[-14,-50],[0,6],[0,-104]],
];
// after-hours corridor guide lights — created here because they need LV
[[-7,LV[1]-0.1,-10],[7,LV[1]-0.1,-10],[-7,LV[1]-0.1,-95],[7,LV[1]-0.1,-95],[0,LV[2]-0.1,-14],[0,LV[2]-0.1,-90]].forEach(([x,y,z])=>{ const gl=new THREE.PointLight(0xfff0c0,0,10,2); gl.position.set(x,y,z); scene.add(gl); _guideLights.push(gl); });
const AX=9, AZ0=-60, AZ1=-40;     // atrium void

/* ----------------------------------------------------- texture helpers */
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tileFloor(){
  const c=cvs(512,512),x=c.getContext('2d'); x.fillStyle='#b7b0a0'; x.fillRect(0,0,512,512);
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){ const g=Math.random()*12;
    x.fillStyle=`rgb(${184-g},${176-g},${160-g})`; x.fillRect(i*64+2,j*64+2,60,60); }
  for(let k=0;k<60;k++){ x.fillStyle='rgba(90,82,66,.06)'; x.beginPath();
    x.arc(Math.random()*512,Math.random()*512,6+Math.random()*22,0,7); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; return t;
}
function noiseTex(base){
  const c=cvs(256,256),x=c.getContext('2d'); x.fillStyle=base; x.fillRect(0,0,256,256);
  for(let i=0;i<1800;i++){x.fillStyle='rgba(0,0,0,'+Math.random()*0.05+')';x.fillRect(Math.random()*256,Math.random()*256,2,2);}
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; return t;
}
function marbleTex(base,vein1,vein2){   // warm marble / stone for walls
  const c=cvs(512,512),x=c.getContext('2d'); x.fillStyle=base; x.fillRect(0,0,512,512);
  // broad vein sweeps
  for(let i=0;i<9;i++){ x.beginPath(); x.strokeStyle=vein1; x.lineWidth=2.5+Math.random()*3;
    let cx=(i*71+30)%512; x.moveTo(cx,0);
    for(let yy=0;yy<=512;yy+=18){ cx+=Math.sin(yy*0.04+i*1.3)*11; x.lineTo(cx,yy); } x.stroke(); }
  // fine detail veins
  for(let i=0;i<14;i++){ x.beginPath(); x.strokeStyle=vein2; x.lineWidth=0.8+Math.random()*1.5;
    let cx=(i*43+10)%512; x.moveTo(cx,0);
    for(let yy=0;yy<=512;yy+=12){ cx+=Math.sin(yy*0.07+i*2.1)*7; x.lineTo(cx,yy); } x.stroke(); }
  // soft surface noise
  for(let i=0;i<600;i++){ x.fillStyle='rgba(255,255,255,'+(Math.random()*0.03)+')'; x.fillRect(Math.random()*512,Math.random()*512,4,4); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; return t;
}
function softDot(){const c=cvs(64,64),x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);}
function beamTex(){const c=cvs(64,256),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256); g.addColorStop(0,'rgba(255,240,205,.5)'); g.addColorStop(1,'rgba(255,240,205,0)');
  x.fillStyle=g; x.fillRect(0,0,64,256); return new THREE.CanvasTexture(c);}

// neon store signs — many names, varied fonts/colours
const STORE_NAMES=['SUNCOAST','SAM GOODY','SPENCER\u2019S','ORANGE JULIUS','REGIS SALON','KB TOYS','WALDENBOOKS',
 'B. DALTON','THE LIMITED','EXPRESS','FOOT LOCKER','RADIOSHACK','CLAIRE\u2019S','HOT TOPIC','GAMESTOP',
 'SOFTWARE ETC','CAMELOT MUSIC','MUSICLAND','AUNTIE ANNE\u2019S','BATH & BODY','PRETZEL TIME','SUNGLASS HUT',
 'PACSUN','A\u00C9ROPOSTALE','STRUCTURE','WET SEAL','CONTEMPO','SBARRO','SHARPER IMAGE','THINGS REMEMBERED',
 'GLAMOUR SHOTS','SPENCER GIFTS','ELECTRONICS BTQ','NATURAL WONDERS','SUNCOAST VIDEO','GADZOOKS'];
const FONTS=['Georgia, serif','"Arial Black", Impact, sans-serif','"Courier New", monospace',
 '"Trebuchet MS", sans-serif','Impact, sans-serif','"Brush Script MT","Segoe Script", cursive','Verdana, sans-serif','Tahoma, sans-serif'];
const HUES=['#ff7bd0','#46d6ff','#ffd24b','#7CFC8A','#ff6a5a','#b98bff','#5af0d8','#ff9b3d'];
function signTex(text,hue,fi){
  const c=cvs(512,128),x=c.getContext('2d');
  // solid dark panel background — signs are now opaque lightboxes, zero depth-fight possible
  x.fillStyle='#13151e'; x.fillRect(0,0,512,128);
  x.strokeStyle='rgba(255,255,255,0.07)'; x.lineWidth=3; x.strokeRect(4,4,504,120);
  const font=FONTS[fi%FONTS.length]; let size=62; x.font='bold '+size+'px '+font;
  while(x.measureText(text).width>470 && size>18){ size-=4; x.font='bold '+size+'px '+font; }
  x.textAlign='center'; x.textBaseline='middle'; x.fillStyle=hue; x.shadowColor=hue;

/* ============================ SURFACE RESOLVER + PHYSICS */
const STEP_UP=0.7, GRAV=20, TICK=1/60;
function groundAt(x,z,feet){ let best=-Infinity,surf=null;
  for(const s of surfaces){ if(s.contains(x,z)){ const h=s.heightAt(x,z); if(h<=feet+STEP_UP&&h>best){ best=h; surf=s; } } } return {h:best,surf}; }
function blocked(x,z,feet){ const top=feet+player.eye, r=player.radius;
  for(const c of colliders){ if(feet<c.yMax&&top>c.yMin&&x>c.minX-r&&x<c.maxX+r&&z>c.minZ-r&&z<c.maxZ+r) return c; }
  for(const c of eleColliders){ if(feet<c.yMax&&top>c.yMin&&x>c.minX-r&&x<c.maxX+r&&z>c.minZ-r&&z<c.maxZ+r) return c; } return null; }
function fixedUpdate(dt){
  updateElevator(dt);
  const f=(keys['KeyW']?1:0)-(keys['KeyS']?1:0), s=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
  const run=keys['ShiftLeft']||keys['ShiftRight'], speed=run?5.4:3.1;
  const sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
  let mx=s*cy-f*sy, mz=-f*cy-s*sy; const L=Math.hypot(mx,mz); if(L>0){mx/=L;mz/=L;}
  const ar=L>0?12:10;
  player.vel.x+=(mx*speed-player.vel.x)*Math.min(1,ar*dt);
  player.vel.z+=(mz*speed-player.vel.z)*Math.min(1,ar*dt);
  const g0=groundAt(player.pos.x,player.pos.z,player.feetY);
  const conv=(g0.surf&&g0.surf.conveyor&&player.onGround)?g0.surf.conveyor:{x:0,z:0};
  const r=player.radius;
  let nx=player.pos.x+(player.vel.x+conv.x)*dt; let c=blocked(nx,player.pos.z,player.feetY);
  if(c){ nx=(player.vel.x+conv.x)>0?c.minX-r:c.maxX+r; player.vel.x=0; } player.pos.x=nx;
  let nz=player.pos.z+(player.vel.z+conv.z)*dt; c=blocked(player.pos.x,nz,player.feetY);
  if(c){ nz=(player.vel.z+conv.z)>0?c.minZ-r:c.maxZ+r; player.vel.z=0; } player.pos.z=nz;
  const g=groundAt(player.pos.x,player.pos.z,player.feetY);
  if(g.h>-Infinity){ if(player.feetY<=g.h+0.06){ player.feetY=g.h; player.velY=0; player.onGround=true; }
    else { player.velY-=GRAV*dt; player.feetY+=player.velY*dt; if(player.feetY<=g.h){ player.feetY=g.h; player.velY=0; player.onGround=true; } else player.onGround=false; } }
  else { player.velY-=GRAV*dt; player.feetY+=player.velY*dt; player.onGround=false; if(player.feetY<-15){ player.pos.set(0,0,4); player.feetY=0; player.velY=0; } }
  const hs=Math.hypot(player.vel.x,player.vel.z); player.step+=hs*dt*1.9;
  player.bob=Math.sin(player.step*2)*0.04*Math.min(1,hs/3);
  if(Math.floor(player.step/Math.PI)!==player._ls&&hs>0.6&&player.onGround){ player._ls=Math.floor(player.step/Math.PI); footstep(run); }
}

/* ================================================================= AUDIO */
let AC=null,reverb=null,busDry=null;
function audioStart(){ if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    busDry=AC.createGain(); busDry.gain.value=0.9; busDry.connect(AC.destination);
    const wet=AC.createGain(); wet.gain.value=0.5; reverb=AC.createConvolver(); reverb.buffer=impulse(3.0,2.3); reverb.connect(wet); wet.connect(AC.destination);
    const pad=AC.createGain(); pad.gain.value=0.02; pad.connect(busDry); pad.connect(reverb);
    [196,247,294].forEach(fr=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=fr;
      const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600; o.connect(lp); lp.connect(pad); o.start(); });
    const hum=AC.createGain(); hum.gain.value=0.035; hum.connect(busDry);
    const ho=AC.createOscillator(); ho.type='sawtooth'; ho.frequency.value=58;
    const hl=AC.createBiquadFilter(); hl.type='lowpass'; hl.frequency.value=120; ho.connect(hl); hl.connect(hum); ho.start();
    scheduleChime(); say('Eastgate Galleria \u2014 mind the closing doors.');
  }catch(e){}
}
function impulse(d,dec){ const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(2,n,AC.sampleRate);
  for(let ch=0;ch<2;ch++){ const a=b.getChannelData(ch); for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec); } return b; }
function scheduleChime(){ if(!AC) return; const t=AC.currentTime+0.1;
  [587,440,587,880].forEach((nf,i)=>{ const o=AC.createOscillator(),g=AC.createGain(); o.type='sine'; o.frequency.value=nf;
    const tt=t+i*0.3; g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(0.045,tt+0.02); g.gain.exponentialRampToValueAtTime(0.001,tt+0.55);
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; o.connect(lp); lp.connect(g); g.connect(busDry); g.connect(reverb); o.start(tt); o.stop(tt+0.6); });
  setTimeout(scheduleChime, 45000+Math.random()*45000); }
function footstep(run){ if(!AC) return; const t=AC.currentTime, src=AC.createBufferSource();
  const n=Math.floor(AC.sampleRate*0.05),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); src.buffer=b;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=run?1400:900;
  const g=AC.createGain(); g.gain.value=run?0.08:0.055; src.connect(lp); lp.connect(g); g.connect(busDry); g.connect(reverb); src.start(t); }

/* ================================================================= MINIMAP */
function drawMap(){ const W=mapCv.width,H=mapCv.height; mapX.clearRect(0,0,W,H);
  const pad=10, sx=(W-2*pad)/(HALF_W*2), sz=(H-2*pad)/(SOUTH-NORTH);
  const X=x=>pad+(x+HALF_W)*sx, Z=z=>pad+(SOUTH-z)*sz;
  mapX.fillStyle='rgba(255,255,255,.07)'; mapX.fillRect(X(-HALF_W),Z(SOUTH),HALF_W*2*sx,(SOUTH-NORTH)*sz);
  mapX.strokeStyle='rgba(255,207,138,.55)'; mapX.lineWidth=1; mapX.strokeRect(X(-HALF_W),Z(SOUTH),HALF_W*2*sx,(SOUTH-NORTH)*sz);
  mapX.fillStyle='rgba(127,224,255,.16)'; mapX.fillRect(X(-AX),Z(AZ1),AX*2*sx,(AZ1-AZ0)*sz);
  mapX.strokeStyle='#7fd0ff'; mapX.lineWidth=3;             // escalator banks (up+down)
  [[-12.5,-30,-22],[-14.5,-30,-22],[-12.5,-78,-70],[-14.5,-78,-70]].forEach(p=>{
    mapX.beginPath(); mapX.moveTo(X(p[0]),Z(p[1])); mapX.lineTo(X(p[0]),Z(p[2])); mapX.stroke(); });
  mapX.fillStyle='#ffd24b'; mapX.fillRect(X(ELE.x0),Z(ELE.z1),(ELE.x1-ELE.x0)*sx,(ELE.z1-ELE.z0)*sz); // elevator
  mapX.fillStyle='rgba(255,207,138,.45)'; mapX.fillRect(X(-HALF_W),Z(SOUTH),HALF_W*2*sx,4); mapX.fillRect(X(-HALF_W),Z(NORTH+10),HALF_W*2*sx,4);
  const px=X(player.pos.x),pz=Z(player.pos.z);
  mapX.save(); mapX.translate(px,pz); mapX.rotate(player.yaw);
  mapX.fillStyle='#ff5a5a'; mapX.beginPath(); mapX.moveTo(0,-6); mapX.lineTo(4,5); mapX.lineTo(-4,5); mapX.closePath(); mapX.fill(); mapX.restore();
}

/* ================================================================= RENDER */
/* ====== BEACH BALL (B key) ====== */
function beachBallTex(){ const c=cvs(256,256),x=c.getContext('2d');
  const cols=['#ff2929','#ffffff','#2979ff','#ffffff','#ffdd00','#ffffff','#29c229','#ff9900'];
  for(let i=0;i<8;i++){ x.fillStyle=cols[i]; x.fillRect(i*32,0,32,256); }
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }
const BBT=beachBallTex();
const _balls=[];
function throwBall(){
  if(!playing) return;
  if(_balls.length>=8){ const old=_balls.shift(); world.remove(old.m); }
  const dir=new THREE.Vector3(); camera.getWorldDirection(dir);
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,14),new THREE.MeshStandardMaterial({map:BBT,roughness:.6}));
  m.castShadow=true;
  m.position.set(camera.position.x+dir.x*0.7, camera.position.y-0.2, camera.position.z+dir.z*0.7);
  world.add(m);
  // always throw with at least 3 m/s upward so the ball arcs visibly before bouncing
  _balls.push({m, vel:new THREE.Vector3(dir.x*11, Math.max(dir.y*11,3.0), dir.z*11)}); }

/* ====== FRISBEE (Y hold → release) — corrected aerodynamics + pull-back throw ====== */
const DA={rho:1.225,area:0.057,mass:0.175,CL0:0.15,CLa:1.4,CD0:0.08,CDa:1.8,a0:-0.07,prec:0.0014};
const _discColors=[0xff5500,0x2266ff,0x22cc44,0xff2299,0xffcc00,0x00cccc];
let _dcIdx=0, _discCharging=false, _discChargeT=0, _discHandMesh=null;
const _discs=[];

function _makeFrisbee(col){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:.35,metalness:.08});
  const rimMat=new THREE.MeshStandardMaterial({color:new THREE.Color(col).multiplyScalar(.72),roughness:.45});
  const botMat=new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:.55});
  // Outer rim torus — the most distinctive frisbee feature
  const rim=new THREE.Mesh(new THREE.TorusGeometry(.118,.030,14,40),rimMat);
  rim.rotation.x=Math.PI/2; rim.position.y=-.006; g.add(rim);
  // Flat top plate inside the rim
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.01,32),mat);
  top.position.y=.022; g.add(top);
  // Shallow dome in the centre
  const dome=new THREE.Mesh(new THREE.SphereGeometry(.062,18,10,0,Math.PI*2,0,Math.PI*.38),mat);
  dome.scale.y=.55; dome.position.y=.028; g.add(dome);
  // White underside
  const bot=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.006,32),botMat);
  bot.position.y=-.032; g.add(bot);
  return g;
}

function _launchDisc(chargeT){
  if(!playing) return;
  if(_discs.length>=6){ const o=_discs.shift(); world.remove(o.mesh); }
  const power=Math.max(0.2, Math.min(1.0, chargeT/0.75)); // 0.2-1.0
  const spd=9+power*9;  // 9-18 m/s throw speed
  const dir=new THREE.Vector3(); camera.getWorldDirection(dir);
  const mesh=_makeFrisbee(_discColors[_dcIdx++%_discColors.length]);
  // Release position: from the throwing-arm side, slightly forward
  mesh.position.set(camera.position.x+dir.x*.6+dir.z*.3,camera.position.y-.15,camera.position.z+dir.z*.6-dir.x*.3);
  world.add(mesh);
  // Disc launches along look direction with upward wrist kick, nose-up ~10°
  const vel=new THREE.Vector3(dir.x*spd, dir.y*spd+1.8*power, dir.z*spd);
  const pitchAx=new THREE.Vector3(dir.z,0,-dir.x).normalize();
  const normal=new THREE.Vector3(0,1,0).applyAxisAngle(pitchAx,-0.17); // nose-up tilt
  _discs.push({mesh, vel, normal, spin:52*power, spinAngle:0, flying:true});
}

/* ====== WATER GUN (G key) ====== */
let _gunOn=false, _gunTimer=0;
const WN=300;
const _wGeo=new THREE.BufferGeometry();
const _wPos=new Float32Array(WN*3), _wVel=new Float32Array(WN*3), _wAge=new Float32Array(WN).fill(99);
for(let i=0;i<WN;i++) _wPos[i*3+1]=-200;
_wGeo.setAttribute('position',new THREE.BufferAttribute(_wPos,3));
const _wSpray=new THREE.Points(_wGeo,new THREE.PointsMaterial({map:TEX.dot,color:0x88d8ff,size:0.09,transparent:true,opacity:.88,depthWrite:false,blending:THREE.AdditiveBlending}));
_wSpray.frustumCulled=false; scene.add(_wSpray);
function _emitWater(n){
  const d=new THREE.Vector3(); camera.getWorldDirection(d);
  for(let e=0;e<n;e++) for(let i=0;i<WN;i++) if(_wAge[i]>1.8){
    _wPos[i*3]=camera.position.x; _wPos[i*3+1]=camera.position.y-.15; _wPos[i*3+2]=camera.position.z;
    const sp=.18; _wVel[i*3]=d.x*11+(Math.random()-.5)*sp; _wVel[i*3+1]=d.y*11+(Math.random()-.5)*sp; _wVel[i*3+2]=d.z*11+(Math.random()-.5)*sp;
    _wAge[i]=0; break; } }

let acc=0,last=performance.now()/1000;
function frame(){ requestAnimationFrame(frame);
  const now=performance.now()/1000; let dt=now-last; last=now; if(dt>0.1)dt=0.1; acc+=dt;
  while(acc>=TICK){ if(playing) fixedUpdate(TICK); acc-=TICK; }
  camera.position.set(player.pos.x,player.feetY+player.eye+player.bob,player.pos.z);
  const cp=Math.cos(player.pitch),sp=Math.sin(player.pitch);
  camera.lookAt(camera.position.x-Math.sin(player.yaw)*cp, camera.position.y+sp, camera.position.z-Math.cos(player.yaw)*cp);
  const lvl=player.feetY>LV[2]-1?'LEVEL 2':player.feetY>LV[1]-1?'LEVEL 1':'GROUND FLOOR';
  if(floorTag.textContent!==lvl) floorTag.textContent=lvl;
  const a=dust.geometry.attributes.position.array; for(let i=0;i<DUST_N;i++){ a[i*3+1]-=0.0013; if(a[i*3+1]<0.1)a[i*3+1]=TOP; }
  dust.geometry.attributes.position.needsUpdate=true;
  // moving escalator steps
  for(const b of escBelts){ b.phase=(b.phase + b.rate*dt) % 1;
    for(let i=0;i<b.count;i++){ const t=(b.phase + i/b.count) % 1;
      b.meshes[i].position.set(b.x, b.y0+(b.y1-b.y0)*t, b.z0+(b.z1-b.z0)*t); } }
  // subtle neon flicker on a few signs
  for(const s of neonSigns){ s.t+=dt; let o=1;
    if(s.flick){ const n=Math.sin(s.t*13.3)+Math.sin(s.t*7.7); o=n<-1.5?0.35:(0.82+0.18*Math.sin(s.t*2)); }
    s.m.opacity=o; s.m.transparent=true; }
  // beach balls — gravity, floor bounce off surfaces, wall bounce off colliders
  for(const b of _balls){
    b.vel.y-=GRAV*dt; b.m.position.addScaledVector(b.vel,dt);
    b.m.rotation.x+=b.vel.z*dt*2; b.m.rotation.z-=b.vel.x*dt*2;
    const bx=b.m.position.x, by=b.m.position.y, bz=b.m.position.z, R=0.22;
    // floor: groundAt(x,z,feet) — pass ball bottom as feet so it finds the right floor level
    const gy=groundAt(bx,bz,by-R).h;
    if(by-R<gy){ b.m.position.y=gy+R;
      b.vel.y=Math.abs(b.vel.y)>0.5?Math.abs(b.vel.y)*0.62:0;
      b.vel.x*=0.80; b.vel.z*=0.80; }
    // wall bounce off colliders
    for(const c of colliders){
      if(by-R>c.yMax||by+R<c.yMin) continue;
      if(bx>c.minX-R&&bx<c.maxX+R&&bz>c.minZ-R&&bz<c.maxZ+R){
        const ox=Math.min(bx-c.minX,c.maxX-bx), oz=Math.min(bz-c.minZ,c.maxZ-bz);
        if(ox<oz){ b.m.position.x=bx<(c.minX+c.maxX)/2?c.minX-R:c.maxX+R; b.vel.x*=-0.55; }
        else      { b.m.position.z=bz<(c.minZ+c.maxZ)/2?c.minZ-R:c.maxZ+R; b.vel.z*=-0.55; }
      }
    }
    b.vel.multiplyScalar(0.999); }
  // frisbee power meter
  if(_discCharging){ _discChargeT+=dt;
    const pct=Math.min(1,_discChargeT/.75); const spd=(9+pct*9).toFixed(1);
    powerFill.style.width=(pct*100)+'%';
    powerFill.style.background=`hsl(${190+pct*20},80%,${50+pct*10}%)`;
    powerVal.textContent=spd+' m/s';
    const ease=pct<.5?2*pct*pct:-1+(4-2*pct)*pct;
    if(_discHandMesh){ _discHandMesh.position.set(.3+ease*.22,-.3,-.42+ease*.28); _discHandMesh.rotation.set(-.12-ease*.08,-.45-ease*.35,.55+ease*.12); } }
  // disc wind-up animation (Y held)
  if(_discCharging&&_discHandMesh){
    _discChargeT+=dt;
    const t=Math.min(1,_discChargeT/.75);
    const ease=t<.5?2*t*t:-1+(4-2*t)*t;
    // Pull-back: disc moves right and back, wrist rotates
    _discHandMesh.position.set(.3+ease*.22, -.3, -.42+ease*.28);
    _discHandMesh.rotation.set(-.12-ease*.08, -.45-ease*.35, .55+ease*.12);
  }
  // frisbee aerodynamics — CORRECTED: drag uses unit velocity vector (was v× too strong before)
  for(const d of _discs){
    if(!d.flying) continue;
    const v=d.vel.length();
    if(v<0.4){ d.flying=false; continue; }
    const vn=d.vel.clone().normalize();          // unit velocity — critical for correct drag
    // Angle of attack: disc normal vs velocity direction
    const sinA=Math.max(-1,Math.min(1, vn.dot(d.normal)));
    const alpha=Math.asin(sinA);
    const CL=Math.max(-0.5,Math.min(1.5, DA.CL0+DA.CLa*alpha));
    const CD=DA.CD0+DA.CDa*Math.pow(alpha-DA.a0,2);
    const q=0.5*DA.rho*DA.area*v*v/DA.mass;      // specific force (m/s²)
    // Lift: perpendicular to velocity, in direction of disc normal component
    const liftDir=d.normal.clone().sub(vn.clone().multiplyScalar(sinA));
    if(liftDir.lengthSq()>1e-8) liftDir.normalize(); else liftDir.set(0,1,0);
    const liftF=liftDir.multiplyScalar(q*CL);
    // Drag: CORRECTLY uses vn (unit vector), not vel — was v× too strong before
    const dragF=vn.clone().multiplyScalar(-q*CD);
    // Gyroscopic precession → characteristic end-of-flight fade
    const prec=DA.prec*v*Math.max(0,CL)*d.spin*dt;
    d.normal.applyAxisAngle(vn,-prec); d.normal.normalize();
    // Real 9.81 m/s² gravity so lift meaningfully counteracts it
    d.vel.x+=(liftF.x+dragF.x)*dt;
    d.vel.y+=(liftF.y+dragF.y-9.81)*dt;
    d.vel.z+=(liftF.z+dragF.z)*dt;
    d.mesh.position.addScaledVector(d.vel,dt);
    d.spin*=Math.pow(0.9997,dt*60); d.spinAngle+=d.spin*dt;
    // Orient: align local-Y to disc normal, spin around that axis
    const N=d.normal.clone().normalize(), Y3=new THREE.Vector3(0,1,0);
    const baseQ=Math.abs(N.dot(Y3))>.9999?new THREE.Quaternion():new THREE.Quaternion().setFromUnitVectors(Y3,N);
    const spinQ=new THREE.Quaternion().setFromAxisAngle(Y3,d.spinAngle);
    d.mesh.quaternion.multiplyQuaternions(baseQ,spinQ);
    // Floor
    const gy=groundAt(d.mesh.position.x,d.mesh.position.z,d.mesh.position.y-.02).h;
    if(d.mesh.position.y<gy+0.025){ d.mesh.position.y=gy+0.025;
      d.vel.set(d.vel.x*.1,0,d.vel.z*.1); d.flying=false; d.mesh.quaternion.copy(baseQ); }
  }
  // water gun — emit while G held
  if(_zombieMode&&playing){
    _zombieTimer+=dt;
    if(_zombieTimer>=Z_SPAWN_INT){ _zombieTimer=0; _spawnZombie(); }
    for(let i=_zombies.length-1;i>=0;i--){
      const zb=_zombies[i];
      if(zb.dead){
        zb.deathT+=dt;
        zb.root.rotation.x=Math.min(Math.PI*.55, zb.deathT*2.8);
        zb.root.position.y-=dt*.4;
        if(zb.deathT>1.6){ world.remove(zb.root); _zombies.splice(i,1); }
        continue;
      }
      zb.hitCooldown=Math.max(0,zb.hitCooldown-dt);
      const px=player.x-zb.root.position.x, pz=player.z-zb.root.position.z;
      const distToPlayer=Math.hypot(px,pz);
      const cy=zb.root.position.y;

      // ground lock
      const gh=groundAt(zb.root.position.x,zb.root.position.z,cy+0.05).h;
      zb.root.position.y+=(gh-cy)*Math.min(1,dt*12); // smooth snap

      // AI state: chase when player within 22m, wander otherwise
      zb.chasing=(distToPlayer<22);
      zb.animT+=dt;

      let moveX=0, moveZ=0;
      if(distToPlayer>1.2){
        if(zb.chasing){
          // chase player directly
          moveX=px/distToPlayer; moveZ=pz/distToPlayer;
          if(distToPlayer>.01) zb.root.rotation.y=Math.atan2(px,pz);
        } else {
          // wander: change direction periodically
          zb.wanderTimer-=dt;
          if(zb.wanderTimer<=0){
            zb.wanderAngle=Math.random()*Math.PI*2;
            zb.wanderTimer=2+Math.random()*3;
          }
          moveX=Math.sin(zb.wanderAngle); moveZ=Math.cos(zb.wanderAngle);
          zb.root.rotation.y=Math.atan2(moveX,moveZ);
        }
        // apply movement with wall/object collision (try full, then X-slide, then Z-slide)
        const spd=Z_SPEED*dt*(zb.chasing?1:0.55);
        const nx=zb.root.position.x+moveX*spd;
        const nz=zb.root.position.z+moveZ*spd;
        if(!_zombieBlocked(nx,nz,cy)){
          zb.root.position.x=nx; zb.root.position.z=nz;
        } else if(!_zombieBlocked(nx,zb.root.position.z,cy)){
          zb.root.position.x=nx; // slide along Z wall
          zb.wanderAngle=Math.atan2(moveX,0)+Math.random()*.8-.4;
        } else if(!_zombieBlocked(zb.root.position.x,nz,cy)){
          zb.root.position.z=nz; // slide along X wall
          zb.wanderAngle=Math.atan2(0,moveZ)+Math.random()*.8-.4;
        } else {
          // fully blocked — turn around + reset wander
          zb.wanderAngle+=Math.PI+(Math.random()-.5)*1.2;
          zb.wanderTimer=0;
        }
        // walk animation: stiff-leg shuffle
        const phase=Math.sin(zb.animT*3.5);
        zb.lLeg.rotation.x=phase*.25; zb.rLeg.rotation.x=-phase*.25;
        zb.head.position.y=1.72+Math.abs(phase)*.025;
        zb.lArm.rotation.z=Math.sin(zb.animT*.8)*.07;
        zb.rArm.rotation.z=-Math.sin(zb.animT*.8)*.07;
      } else {
        // attack: arm thrust toward player
        if(distToPlayer>.01) zb.root.rotation.y=Math.atan2(px,pz);
        const th=Math.sin(zb.animT*8);
        zb.lArm.rotation.x=-Math.PI/2+th*.4; zb.rArm.rotation.x=-Math.PI/2-th*.4;
      }

      // ball collision
      for(const b of _balls){
        if(zb.hitCooldown<=0&&b.m.position.distanceTo(zb.root.position)<0.85){
          _zombieHit(zb); b.vel.multiplyScalar(.25); }}
      // disc collision
      for(const d of _discs){
        if(d.flying&&zb.hitCooldown<=0&&d.mesh.position.distanceTo(zb.root.position)<0.9){
          _zombieHit(zb); d.vel.multiplyScalar(.15); }}
    }
    _zHud.textContent=`☣ ZOMBIES: ${_zombies.filter(z=>!z.dead).length}`;
  }
  if(_gunOn&&playing){ _gunTimer+=dt; while(_gunTimer>.012){ _emitWater(3); _gunTimer-=.012; } }
  for(let i=0;i<WN;i++) if(_wAge[i]<1.8){
    _wAge[i]+=dt; _wVel[i*3+1]-=22*dt;
    _wPos[i*3]+=_wVel[i*3]*dt; _wPos[i*3+1]+=_wVel[i*3+1]*dt; _wPos[i*3+2]+=_wVel[i*3+2]*dt;
    if(_wPos[i*3+1]<groundAt(_wPos[i*3],_wPos[i*3+2],_wPos[i*3+1]).h) _wAge[i]=99;
  } else _wPos[i*3+1]=-200;
  _wGeo.attributes.position.needsUpdate=true;
  // fountain spray: ballistic droplets, reseed when they fall back to the water
  if(fountainSpray){ const g=Math.min(dt,0.05);
    for(let i=0;i<fN;i++){ fVel[i*3+1]-=20*g;
      fPos[i*3]+=fVel[i*3]*g; fPos[i*3+1]+=fVel[i*3+1]*g; fPos[i*3+2]+=fVel[i*3+2]*g;
      if(fPos[i*3+1]<fWL+0.05) fSeed(i); }
    fGeo.attributes.position.needsUpdate=true; }
  if(playing&&(now%0.067<dt)) drawMap();  // ~15fps throttle — minimap barely changes per frame
  renderer.render(scene,camera);
}

let lp=0; const li=setInterval(()=>{ lp=Math.min(100,lp+14+Math.random()*18); loadbar.style.width=lp+'%';
  if(lp>=100){ clearInterval(li); setTimeout(()=>loadbar.style.opacity=0,300);} },70);
frame();
})();
</script>
